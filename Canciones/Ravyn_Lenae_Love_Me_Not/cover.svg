<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0518"/>
      <stop offset="40%" stop-color="#1f0c38"/>
      <stop offset="75%" stop-color="#4c1248"/>
      <stop offset="100%" stop-color="#090514"/>
    </linearGradient>

    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.45"/>
      <stop offset="45%" stop-color="#f43f5e" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0a0518" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="petalGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="petalGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>

    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="800" fill="url(#bgGrad)"/>
  <circle cx="400" cy="400" r="340" fill="url(#centerGlow)"/>

  <!-- Subtle vinyl groove rings -->
  <circle cx="400" cy="400" r="300" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="2"/>
  <circle cx="400" cy="400" r="240" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1.5"/>
  <circle cx="400" cy="400" r="180" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>

  <!-- Daisy Petals (He Loves Me / He Loves Me Not Motif) -->
  <g transform="translate(400, 380)">
    <!-- Falling / Floating Petals -->
    <path d="M 0,-140 C 25,-100 25,-40 0,-10 C -25,-40 -25,-100 0,-140 Z" fill="url(#petalGrad1)" opacity="0.9" filter="url(#glowEffect)"/>
    <path d="M 98,-98 C 100,-60 65,-25 0,-10 C 60,-65 90,-90 98,-98 Z" fill="url(#petalGrad2)" opacity="0.85"/>
    <path d="M 140,0 C 100,25 40,25 10,0 C 40,-25 100,-25 140,0 Z" fill="url(#petalGrad1)" opacity="0.9"/>
    <path d="M 98,98 C 65,100 25,65 0,10 C 65,60 90,90 98,98 Z" fill="url(#petalGrad2)" opacity="0.75"/>
    <path d="M 0,140 C -25,100 -25,40 0,10 C 25,40 25,100 0,140 Z" fill="url(#petalGrad1)" opacity="0.8"/>
    <path d="M -98,98 C -100,60 -65,25 0,10 C -60,65 -90,90 -98,98 Z" fill="url(#petalGrad2)" opacity="0.85"/>
    <path d="M -140,0 C -100,-25 -40,-25 -10,0 C -40,25 -100,25 -140,0 Z" fill="url(#petalGrad1)" opacity="0.9"/>
    <path d="M -98,-98 C -65,-100 -25,-65 0,-10 C -65,-60 -90,-90 -98,-98 Z" fill="url(#petalGrad2)" opacity="0.75"/>

    <!-- Detached falling petal -->
    <path d="M 160,-170 C 180,-140 170,-100 145,-90 C 130,-115 135,-155 160,-170 Z" fill="#fb7185" opacity="0.85" filter="url(#glowEffect)" transform="rotate(25)"/>

    <!-- Flower Core -->
    <circle cx="0" cy="0" r="32" fill="#fbbf24" filter="url(#glowEffect)"/>
    <circle cx="0" cy="0" r="24" fill="#f59e0b"/>
  </g>

  <!-- Typography -->
  <text x="400" y="610" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="44" font-weight="900" fill="#ffffff" letter-spacing="4">
    LOVE ME NOT
  </text>
  <text x="400" y="655" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="22" font-weight="700" fill="#c084fc" letter-spacing="8">
    RAYVN LENAE
  </text>
  <text x="400" y="695" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="14" font-weight="600" fill="#94a3b8" letter-spacing="3">
    BIRD'S EYE · ESCUCHA ACTIVA
  </text>
</svg>
