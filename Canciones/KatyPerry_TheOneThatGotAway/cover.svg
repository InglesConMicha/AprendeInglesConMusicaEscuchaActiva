<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1035"/>
      <stop offset="35%" stop-color="#4c1d55"/>
      <stop offset="70%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="50%" cy="55%" r="45%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.95"/>
      <stop offset="30%" stop-color="#f97316" stop-opacity="0.6"/>
      <stop offset="70%" stop-color="#db2777" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#1e1035" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="seaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9a3412"/>
      <stop offset="50%" stop-color="#431407"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="carGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#075985"/>
    </linearGradient>
    <filter id="retroGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="shadowFilter" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.65"/>
    </filter>
  </defs>

  <!-- Sky Background -->
  <rect width="800" height="800" fill="url(#skyGrad)"/>

  <!-- Sun Glow -->
  <circle cx="400" cy="440" r="260" fill="url(#sunGlow)"/>
  <circle cx="400" cy="440" r="90" fill="#fff" opacity="0.85" filter="url(#retroGlow)"/>

  <!-- Stars in sky -->
  <g fill="#ffffff" opacity="0.6">
    <circle cx="120" cy="90" r="1.5"/>
    <circle cx="280" cy="60" r="2"/>
    <circle cx="680" cy="110" r="2.5"/>
    <circle cx="550" cy="70" r="1.5"/>
    <circle cx="180" cy="160" r="1.2"/>
    <circle cx="720" cy="190" r="1.8"/>
    <circle cx="340" cy="130" r="1.5"/>
  </g>

  <!-- Distant Mountains -->
  <path d="M0 480 Q180 410 360 450 T800 440 L800 550 L0 550 Z" fill="#31122a" opacity="0.75"/>
  <path d="M0 495 Q240 440 500 480 T800 465 L800 560 L0 560 Z" fill="#1e1026" opacity="0.95"/>

  <!-- Sea & Coast -->
  <rect y="520" width="800" height="280" fill="url(#seaGrad)"/>

  <!-- Sunset reflection on water -->
  <ellipse cx="400" cy="550" rx="130" ry="12" fill="#fed7aa" opacity="0.45" filter="url(#retroGlow)"/>
  <ellipse cx="400" cy="580" rx="90" ry="8" fill="#fdba74" opacity="0.35"/>
  <ellipse cx="400" cy="620" rx="60" ry="6" fill="#fb923c" opacity="0.25"/>

  <!-- Coastal Highway Curve -->
  <path d="M-50 800 Q200 680 400 650 T850 630 L850 800 Z" fill="#18181b"/>
  <path d="M-50 800 Q200 680 400 650 T850 630" stroke="#fbbf24" stroke-width="4" stroke-dasharray="25,20" fill="none" opacity="0.8"/>

  <!-- Retro Mustang Silhouette with Blue Shading -->
  <g transform="translate(180, 500)" filter="url(#shadowFilter)">
    <!-- Car Body -->
    <path d="M50 120 C70 90, 120 70, 200 70 L280 70 C340 70, 390 95, 410 115 L430 130 C440 135, 445 145, 440 155 L430 165 C410 168, 380 168, 360 168 C340 168, 330 150, 310 150 C290 150, 280 168, 170 168 C150 168, 140 150, 120 150 C100 150, 90 168, 40 168 C25 168, 20 155, 25 145 Z" fill="url(#carGrad)"/>
    <!-- Roof and windows -->
    <path d="M130 75 L180 30 L280 30 L330 75 Z" fill="#0c4a6e"/>
    <path d="M145 72 L185 36 L270 36 L305 72 Z" fill="#38bdf8" opacity="0.45"/>
    <!-- Wheels -->
    <circle cx="120" cy="165" r="28" fill="#09090b" stroke="#71717a" stroke-width="5"/>
    <circle cx="120" cy="165" r="14" fill="#d4d4d8"/>
    <circle cx="340" cy="165" r="28" fill="#09090b" stroke="#71717a" stroke-width="5"/>
    <circle cx="340" cy="165" r="14" fill="#d4d4d8"/>
    <!-- Taillight Glow -->
    <rect x="25" y="132" width="8" height="18" rx="3" fill="#ef4444" filter="url(#retroGlow)"/>
    <!-- Headlight Glow -->
    <path d="M430 135 L580 170 L520 220 L420 155 Z" fill="#fef08a" opacity="0.15"/>
  </g>

  <!-- Vintage Vinyl/Cassette Decorative Circle Top Right -->
  <g transform="translate(680, 120)" opacity="0.75">
    <circle cx="0" cy="0" r="50" fill="none" stroke="#f472b6" stroke-width="2" stroke-dasharray="6,4"/>
    <circle cx="0" cy="0" r="40" fill="none" stroke="#f472b6" stroke-width="1"/>
    <text x="0" y="5" font-family="'Outfit', sans-serif" font-size="11" font-weight="700" fill="#f472b6" text-anchor="middle" letter-spacing="2">RADIOHEAD</text>
  </g>

  <!-- Typography Header -->
  <text x="400" y="110" font-family="'Outfit', -apple-system, sans-serif" font-size="24" font-weight="800" fill="#fde047" text-anchor="middle" letter-spacing="8" filter="url(#retroGlow)">
    KATY PERRY
  </text>
  
  <!-- Song Title -->
  <text x="400" y="175" font-family="'Outfit', -apple-system, sans-serif" font-size="44" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="2" filter="url(#shadowFilter)">
    THE ONE THAT GOT AWAY
  </text>

  <text x="400" y="215" font-family="'Outfit', -apple-system, sans-serif" font-size="16" font-weight="600" fill="#f472b6" text-anchor="middle" letter-spacing="4">
    TEENAGE DREAM · ESCUCHA ACTIVA
  </text>

  <!-- Bottom Badge: Nostalgia Tagline -->
  <rect x="230" y="730" width="340" height="42" rx="21" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(251, 191, 36, 0.4)" stroke-width="1.5"/>
  <text x="400" y="756" font-family="'Outfit', -apple-system, sans-serif" font-size="14" font-weight="700" fill="#fef08a" text-anchor="middle" letter-spacing="1">
    ✨ "In another life, I would be your girl"
  </text>
</svg>
