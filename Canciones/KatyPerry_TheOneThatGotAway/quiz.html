<script>
  // Web Audio Context for immediate sounds
  const AudioCtx = window.AudioContext || window.webkitAudioContext;
  let audioCtx = null;

  function playSound(type) {
    try {
      if (!audioCtx) audioCtx = new AudioCtx();
      if (audioCtx.state === 'suspended') audioCtx.resume();

      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);

      if (type === 'correct') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(523.25, audioCtx.currentTime); // C5
        osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.1); // E5
        osc.frequency.setValueAtTime(783.99, audioCtx.currentTime + 0.2); // G5
        gain.gain.setValueAtTime(0.18, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.35);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.35);
      } else {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(220, audioCtx.currentTime);
        osc.frequency.setValueAtTime(174.61, audioCtx.currentTime + 0.12);
        gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.3);
      }
    } catch (e) {
      // Audio not permitted or supported
    }
  }

  const questions = [

    {

    {

      question: '¿Qué significa la expresión irónica "Like we had a clue"?',

      options: [
        'Una obligación presente que tiene hoy',
        'Arrepentimiento por algo que debió haber hecho en el pasado pero no hizo',
        'Una felicitación por haber expresado sus sentimientos a tiempo',
        'Una recomendación para el futuro'
      ],
      correctIndex: 1,
      explanation: '<b>"Should have + Participio"</b> (abreviado en el habla como <i>should\'ve</i> /ʃʊdəv/) expresa arrepentimiento o reproche retrospectivo: "Debí haberte dicho...".'
    },
    {
      category: 'Modismos · Idioms',
      question: '¿Qué significa el modismo "Pay the price"?',
      context: '"\'Cause now I pay the price / In another life, I would be your girl"',
      options: [
        'Pagar una cuenta bancaria con intereses',
        'Sufrir el alto costo emocional o las consecuencias negativas de tus errores',
        'Comprar un anillo de diamantes costoso',
        'Reclamar un descuento en la tienda'
      ],
      correctIndex: 1,
      explanation: 'En sentido figurado, <b>"pay the price"</b> significa asumir las consecuencias amargas o el sufrimiento derivado de malas decisiones del pasado.'
    },
    {
      category: 'Collocations & Expresiones',
      question: '¿Qué significa la frase "Keep all our promises"?',
      context: '"We\'d keep all our promises / Be us against the world"',
      options: [
        'Romper o traicionar las promesas',
        'Cumplir y respetar todas nuestras promesas',
        'Escribir secretos en un diario personal',
        'Inventar mentiras piadosas'
      ],
      correctIndex: 1,
      explanation: 'La colocación natural en inglés para "cumplir una promesa" es <b>"keep a promise"</b> (lo contrario es <i>break a promise</i>).'
    }
  ];

  let currentIdx = 0;
  let score = 0;
  let streak = 0;
  let xp = 0;
  let answered = false;

  function renderQuestion() {
    answered = false;
    document.getElementById('btn-next').disabled = true;

    const q = questions[currentIdx];
    const total = questions.length;
    const progress = Math.round(((currentIdx + 1) / total) * 100);

    document.getElementById('progress-text').innerText = `Pregunta ${currentIdx + 1} de ${total}`;
    document.getElementById('progress-percent').innerText = `${progress}%`;
    document.getElementById('progress-fill').style.width = `${progress}%`;

    const letters = ['A', 'B', 'C', 'D'];
    const optionsHtml = q.options.map((opt, i) => `
      <button class="option-btn" onclick="selectOption(${i})" id="opt-${i}">
        <span class="option-letter">${letters[i]}</span>
        <span>${opt}</span>
      </button>
    `).join('');

    const html = `
      <div style="animation: fadeIn 0.3s ease;">
        <span class="category-tag">${q.category}</span>
        <div class="question-title">${q.question}</div>
        <div class="context-box">🎵 ${q.context}</div>
        <div class="options-list">${optionsHtml}</div>
        <div class="feedback-box" id="feedback-box"></div>
      </div>
    `;

    document.getElementById('quiz-area').innerHTML = html;
  }

  function selectOption(index) {
    if (answered) return;
    answered = true;

    const q = questions[currentIdx];
    const isCorrect = (index === q.correctIndex);
    const feedbackBox = document.getElementById('feedback-box');

    // Deshabilitar botones y aplicar colores
    for (let i = 0; i < q.options.length; i++) {
      const btn = document.getElementById(`opt-${i}`);
      btn.disabled = true;
      if (i === q.correctIndex) {
        btn.classList.add('correct');
      } else if (i === index) {
        btn.classList.add('incorrect');
      }
    }

    if (isCorrect) {
      playSound('correct');
      score++;
      streak++;
      xp += 15 + (streak * 2);
      document.getElementById('streak-count').innerText = streak;
      document.getElementById('xp-count').innerText = xp;

      feedbackBox.className = 'feedback-box correct';
      feedbackBox.innerHTML = `<b>¡Excelente! 🎉</b><br>${q.explanation}`;
    } else {
      playSound('wrong');
      streak = 0;
      document.getElementById('streak-count').innerText = streak;

      feedbackBox.className = 'feedback-box incorrect';
      feedbackBox.innerHTML = `<b>Respuesta Incorrecta</b><br>${q.explanation}`;
    }

    document.getElementById('btn-next').disabled = false;
    document.getElementById('btn-next').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  function nextQuestion() {
    currentIdx++;
    if (currentIdx < questions.length) {
      renderQuestion();
    } else {
      showResults();
    }
  }

  function showResults() {
    playSound('correct');
    const total = questions.length;
    const percentage = Math.round((score / total) * 100);

    let trophy = '🏆';
    let message = '¡Extraordinario dominio de la canción!';
    if (percentage < 60) {
      trophy = '🎧';
      message = '¡Buen intento! Repasa la letra en el reproductor de Escucha Activa.';
    } else if (percentage < 85) {
      trophy = '🌟';
      message = '¡Muy buen trabajo! Tienes gran oído y vocabulario.';
    }

    const html = `
      <div class="results-container">
        <div class="results-trophy">${trophy}</div>
        <div class="results-title">¡Quiz Completado!</div>
        <div class="results-subtitle">${message}</div>

        <div class="results-score-grid">
          <div class="score-card">
            <div class="score-value">${score}/${total}</div>
            <div class="score-label">Aciertos</div>
          </div>
          <div class="score-card">
            <div class="score-value">${percentage}%</div>
            <div class="score-label">Precisión</div>
          </div>
          <div class="score-card">
            <div class="score-value">+${xp}</div>
            <div class="score-label">XP Ganada</div>
          </div>
        </div>

        <div class="results-actions">
          <a href="../../player.html?song=KatyPerry_TheOneThatGotAway" class="btn-next" style="text-decoration:none; justify-content:center;">
            🎧 Practicar Escucha Activa
          </a>
          <button class="btn-next" onclick="restartQuiz()" style="background:rgba(255,255,255,0.08); box-shadow:none; justify-content:center;">
            🔄 Repetir Quiz
          </button>
          <a href="../../index.html" class="btn-back" style="justify-content:center; margin-top:10px;">
            🏠 Volver al Catálogo Principal
          </a>
        </div>
      </div>
    `;

    document.getElementById('quiz-area').innerHTML = html;
    document.querySelector('.progress-wrapper').style.display = 'none';
    document.querySelector('.footer-actions').style.display = 'none';
  }

  function restartQuiz() {
    currentIdx = 0;
    score = 0;
    streak = 0;
    xp = 0;
    document.getElementById('streak-count').innerText = '0';
    document.getElementById('xp-count').innerText = '0';
    document.querySelector('.progress-wrapper').style.display = 'block';
    document.querySelector('.footer-actions').style.display = 'flex';
    renderQuestion();
  }

  // Inicializar al cargar
  window.addEventListener('DOMContentLoaded', renderQuestion);
</script>

</body>
</html>
