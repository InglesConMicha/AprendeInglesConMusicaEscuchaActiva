<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz Interactivo - Stitches (Shawn Mendes) 🧠</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">

  <!-- Favicon de Música SVG Premium -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2338bdf8' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M9 18V5l12-2v13'%3E%3C/path%3E%3Ccircle cx='6' cy='18' r='3' fill='%2338bdf8'%3E%3C/circle%3E%3Ccircle cx='18' cy='16' r='3' fill='%2338bdf8'%3E%3C/circle%3E%3C/svg%3E">

  <style>
    :root {
      --bg-color: #0b0f19;
      --bg-gradient: linear-gradient(135deg, #090d16 0%, #0f172a 50%, #1e1b4b 100%);
      --card-bg: rgba(30, 41, 59, 0.75);
      --card-border: rgba(255, 255, 255, 0.08);
      --accent-primary: #38bdf8; /* Shawn Mendes Sky Blue */
      --accent-secondary: #818cf8; /* Indigo */
      --accent-success: #4ade80; /* Emerald */
      --accent-error: #f87171; /* Coral Red */
      --accent-warning: #fde047; /* Yellow */
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      transition: all 0.25s ease;
    }

    body {
      font-family: 'Outfit', system-ui, -apple-system, sans-serif;
      background: var(--bg-color);
      background-image: var(--bg-gradient);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      overflow-x: hidden;
    }

    .app-container {
      width: 100%;
      max-width: 680px;
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--card-border);
      border-radius: 28px;
      padding: 32px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5),
                  0 0 40px rgba(56, 189, 248, 0.05);
      position: relative;
      overflow: hidden;
      min-height: 520px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      font-size: 0.9rem;
      font-weight: 600;
    }

    .streak-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #f87171;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.85rem;
    }

    .xp-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(253, 224, 71, 0.15);
      border: 1px solid rgba(253, 224, 71, 0.3);
      color: var(--accent-warning);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.85rem;
    }

    .progress-wrapper {
      margin-bottom: 24px;
    }

    .progress-header {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 8px;
      font-weight: 600;
    }

    .progress-bg {
      width: 100%;
      height: 8px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 6px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(to right, var(--accent-primary), var(--accent-secondary));
      border-radius: 6px;
      transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* Tarjeta de Pregunta */
    .question-card {
      display: flex;
      flex-direction: column;
      gap: 16px;
      flex-grow: 1;
    }

    .category-tag {
      align-self: flex-start;
      background: rgba(56, 189, 248, 0.15);
      border: 1px solid rgba(56, 189, 248, 0.3);
      color: var(--accent-primary);
      padding: 4px 12px;
      border-radius: 10px;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .question-text {
      font-size: 1.35rem;
      font-weight: 700;
      line-height: 1.4;
      color: #fff;
    }

    .context-box {
      background: rgba(15, 23, 42, 0.6);
      border-left: 4px solid var(--accent-primary);
      padding: 12px 16px;
      border-radius: 0 12px 12px 0;
      font-size: 1rem;
      color: #e2e8f0;
      font-style: italic;
    }

    /* Opciones */
    .options-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
      margin-top: 10px;
    }

    .option-btn {
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: var(--text-main);
      padding: 16px 20px;
      border-radius: 16px;
      font-size: 1rem;
      font-weight: 600;
      text-align: left;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 14px;
      font-family: inherit;
    }

    .option-btn:hover:not(:disabled) {
      background: rgba(56, 189, 248, 0.12);
      border-color: rgba(56, 189, 248, 0.4);
      transform: translateX(4px);
    }

    .option-btn .option-letter {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.06);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--accent-primary);
      flex-shrink: 0;
    }

    .option-btn.correct {
      background: rgba(74, 222, 128, 0.18) !important;
      border-color: var(--accent-success) !important;
      color: #86efac !important;
    }

    .option-btn.correct .option-letter {
      background: var(--accent-success);
      color: #052e16;
    }

    .option-btn.incorrect {
      background: rgba(248, 113, 113, 0.18) !important;
      border-color: var(--accent-error) !important;
      color: #fca5a5 !important;
    }

    .option-btn.incorrect .option-letter {
      background: var(--accent-error);
      color: #450a0a;
    }

    /* Feedback */
    .feedback-box {
      margin-top: 16px;
      padding: 16px;
      border-radius: 14px;
      font-size: 0.95rem;
      line-height: 1.5;
      display: none;
      animation: fadeIn 0.3s ease;
    }

    .feedback-box.correct {
      background: rgba(74, 222, 128, 0.1);
      border: 1px solid rgba(74, 222, 128, 0.25);
      color: #86efac;
      display: block;
    }

    .feedback-box.incorrect {
      background: rgba(248, 113, 113, 0.1);
      border: 1px solid rgba(248, 113, 113, 0.25);
      color: #fca5a5;
      display: block;
    }

    /* Footer / Botón Continuar */
    .footer-actions {
      margin-top: 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .btn-next {
      background: linear-gradient(to right, #0284c7, #0369a1);
      color: white;
      border: none;
      padding: 14px 28px;
      border-radius: 14px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-family: inherit;
      box-shadow: 0 4px 15px rgba(2, 132, 199, 0.25);
    }

    .btn-next:hover {
      background: linear-gradient(to right, #0369a1, #075985);
      box-shadow: 0 6px 20px rgba(2, 132, 199, 0.4);
      transform: translateY(-2px);
    }

    .btn-next:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    .btn-back {
      background: transparent;
      color: var(--text-muted);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 12px 20px;
      border-radius: 12px;
      font-size: 0.9rem;
      font-weight: 600;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .btn-back:hover {
      color: #fff;
      border-color: rgba(255, 255, 255, 0.25);
      background: rgba(255, 255, 255, 0.05);
    }

    /* Pantalla de Resultados */
    .results-screen {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      padding: 20px 0;
    }

    .results-trophy {
      font-size: 4.5rem;
      animation: pulse 2s infinite;
    }

    .score-circle {
      width: 130px;
      height: 130px;
      border-radius: 50%;
      background: rgba(56, 189, 248, 0.1);
      border: 4px solid var(--accent-primary);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 10px 0;
    }

    .score-number {
      font-size: 2.4rem;
      font-weight: 800;
      color: var(--accent-primary);
    }

    .score-label {
      font-size: 0.8rem;
      color: var(--text-muted);
      text-transform: uppercase;
      font-weight: 600;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.08); }
    }
  </style>
</head>
<body>

<div class="app-container">
  
  <!-- Encabezado de Estado (XP / Racha) -->
  <div class="status-bar">
    <div class="streak-badge" id="streak-badge">
      🔥 <span id="streak-count">0</span> Racha
    </div>
    <div class="xp-badge" id="xp-badge">
      ⭐ <span id="xp-count">0</span> XP
    </div>
  </div>

  <!-- Barra de Progreso -->
  <div class="progress-wrapper">
    <div class="progress-header">
      <span id="progress-text">Pregunta 1 de 10</span>
      <span id="progress-percent">10%</span>
    </div>
    <div class="progress-bg">
      <div class="progress-fill" id="progress-fill"></div>
    </div>
  </div>

  <!-- Contenedor Principal de la Pregunta -->
  <div id="quiz-area">
    <!-- Renderizado por JS -->
  </div>

  <!-- Botones de Acción -->
  <div class="footer-actions">
    <a href="../../index.html" class="btn-back">🏠 Catálogo</a>
    <button class="btn-next" id="btn-next" onclick="nextQuestion()" disabled>Continuar ➔</button>
  </div>

</div>

<script>
  const questions = [
    {
      category: 'Vocabulario',
      question: '¿Qué significa la palabra "Stitches" en el título y coro de la canción?',
      context: '"And now that I\'m without your kisses, I\'ll be needing stitches"',
      options: [
        'Besos y caricias',
        'Puntos de sutura / coser una herida',
        'Abrazos cálidos',
        'Zapatos nuevos'
      ],
      correctIndex: 1,
      explanation: '<b>"Stitches"</b> se refiere a los puntos de sutura quirúrgicos utilizados para cerrar una herida abierta. En la canción funciona como una metáfora del dolor provocado por la ruptura amorosa.'
    },
    {
      category: 'Modismos & Idioms',
      question: '¿Qué significa el modismo "Reap what I sow" en la canción?',
      context: '"Your bitter heart cold to the touch / Now I\'m gonna reap what I sow"',
      options: [
        'Voy a sembrar plantas en el jardín',
        'Voy a cosechar lo que sembré (afrontar las consecuencias)',
        'Voy a olvidar todo lo que pasó',
        'Voy a ganar mucho dinero'
      ],
      correctIndex: 1,
      explanation: '<b>"You reap what you sow"</b> es un proverbio en inglés que equivale en español a "cosechas lo que siembras", es decir, asumir las consecuencias naturales de tus acciones pasadas.'
    },
    {
      category: 'Pronunciación & Silent Letters',
      question: '¿Qué letra es muda (silenciosa) en las palabras "knife" y "knees"?',
      context: '"Your words cut deeper than a knife" / "Falling onto my knees"',
      options: [
        'La letra "N"',
        'La letra "K"',
        'La letra "E"',
        'La letra "F"'
      ],
      correctIndex: 1,
      explanation: 'En combinaciones <b>"kn-"</b> al inicio de palabra en inglés (como <i>knife, knees, know, knight</i>), la letra <b>K</b> siempre es muda y solo se pronuncia el sonido /n/.'
    },
    {
      category: 'Phrasal Verbs',
      question: '¿Qué significa el phrasal verb "Go under" en este contexto lírico?',
      context: '"Got a feeling that I\'m going under, but I know that I\'ll make it out alive"',
      options: [
        'Hundirse o sucumbir emocionalmente',
        'Caminar por debajo de un puente',
        'Dormirse profundamente',
        'Bailar en el suelo'
      ],
      correctIndex: 0,
      explanation: '<b>"Go under"</b> literalmente significa hundirse en el agua, pero en sentido figurado describe sentirse abrumado, ahogado en dolor o sucumbiendo a una crisis.'
    },
    {
      category: 'Gramática: Verbos de Percepción',
      question: 'En la frase "You watch me bleed", ¿por qué el verbo "bleed" va en su forma base?',
      context: '"You watch me bleed until I can\'t breathe"',
      options: [
        'Porque después de verbos de percepción (watch/see/hear) se usa objeto + forma base',
        'Porque es un tiempo pasado irregular',
        'Porque es un error gramatical común en canciones',
        'Porque es un imperativo directo'
      ],
      correctIndex: 0,
      explanation: 'En inglés, los verbos de percepción como <b>watch, see, hear, feel</b> siguen la estructura <i>Verbo + Objeto + Verbo Base (o -ing)</i>: <i>"You watch me bleed"</i> (Me miras desangrarme).'
    },
    {
      category: 'Vocabulario & Similes',
      question: '¿Qué describe la metáfora "Like a moth drawn to a flame"?',
      context: '"Just like a moth drawn to a flame, oh you lured me in..."',
      options: [
        'Sentir mucho calor durante el verano',
        'Una atracción irresistible hacia algo peligroso o destructivo',
        'Tener miedo a la oscuridad',
        'Comprar ropa nueva'
      ],
      correctIndex: 1,
      explanation: '<b>"Like a moth to a flame"</b> describe una atracción fatal e incontrolable, tal como una polilla que no puede evitar volar hacia la llama que la quemará.'
    },
    {
      category: 'Modismos & Slang',
      question: '¿Qué significa la expresión "See red" en la línea "I\'m left seeing red on my own"?',
      context: '"I\'m left seeing red on my own"',
      options: [
        'Tener los ojos irritados',
        'Enfurecerse o perder el control por rabia e impotencia',
        'Mirar una luz roja de tráfico',
        'Estar enamorado apasionadamente'
      ],
      correctIndex: 1,
      explanation: '<b>"To see red"</b> es un modismo común que significa estar extremadamente furioso o cegado por la ira.'
    },
    {
      category: 'Connected Speech & Slang',
      question: '¿Qué palabras formales se contraen en "Needle and the thread, gotta get you out of my head"?',
      context: '"Needle and the thread, gotta get you out of my head"',
      options: [
        'gotta = have got to (tener que)',
        'gotta = go to (ir a)',
        'gotta = get to (llegar a)',
        'gotta = good to (bueno para)'
      ],
      correctIndex: 0,
      explanation: '<b>"Gotta"</b> es la reducción coloquial de <i>"have got to"</i> o <i>"got to"</i>, que expresa obligación o necesidad ("tengo que").'
    },
    {
      category: 'Gramática & Vocabulario',
      question: '¿Cuál es la diferencia correcta entre "Breath" y "Breathe"?',
      context: '"You watch me bleed until I can\'t breathe"',
      options: [
        'Son exactamente la misma palabra sin diferencia',
        '"Breath" /brɛθ/ es el sustantivo (aire/aliento), y "Breathe" /briːð/ es el verbo (respirar)',
        '"Breath" es el verbo y "Breathe" es el sustantivo',
        'Ninguna de las anteriores'
      ],
      correctIndex: 1,
      explanation: '<b>Breath</b> /brɛθ/ (sin "e" final) es sustantivo ("take a deep breath"). <b>Breathe</b> /briːð/ (con "e" final) es el verbo ("I can\'t breathe").'
    },
    {
      category: 'Comprensión Global',
      question: '¿Cuál es el tema central que transmite Shawn Mendes a lo largo de "Stitches"?',
      context: '"Tripping over myself / Aching, begging you to come help"',
      options: [
        'La emoción de iniciar una nueva relación romántica',
        'El dolor físico y emocional visceral que deja una traición o ruptura amorosa',
        'Un viaje por la carretera con amigos',
        'Un consejo financiero sobre cómo ahorrar dinero'
      ],
      correctIndex: 1,
      explanation: 'La canción utiliza continuas metáforas de lesiones físicas (cortadas, sangrado, puntos de sutura, aguja e hilo) para representar el impacto emocional devastador de un corazón roto.'
    }
  ];

  let currentQuestionIdx = 0;
  let streak = 0;
  let xp = 0;
  let score = 0;
  let hasAnswered = false;

  const quizArea = document.getElementById('quiz-area');
  const btnNext = document.getElementById('btn-next');
  const streakCount = document.getElementById('streak-count');
  const xpCount = document.getElementById('xp-count');
  const progressText = document.getElementById('progress-text');
  const progressPercent = document.getElementById('progress-percent');
  const progressFill = document.getElementById('progress-fill');

  function renderQuestion() {
    hasAnswered = false;
    btnNext.disabled = true;

    const q = questions[currentQuestionIdx];
    const total = questions.length;
    const currentNum = currentQuestionIdx + 1;
    const percent = Math.round(((currentNum - 1) / total) * 100);

    progressText.innerText = `Pregunta ${currentNum} de ${total}`;
    progressPercent.innerText = `${percent}%`;
    progressFill.style.width = `${percent}%`;

    let optionsHTML = '';
    const letters = ['A', 'B', 'C', 'D'];
    q.options.forEach((opt, idx) => {
      optionsHTML += `
        <button class="option-btn" onclick="selectOption(${idx})" id="opt-${idx}">
          <span class="option-letter">${letters[idx]}</span>
          <span>${opt}</span>
        </button>
      `;
    });

    quizArea.innerHTML = `
      <div class="question-card">
        <span class="category-tag">${q.category}</span>
        <div class="question-text">${q.question}</div>
        ${q.context ? `<div class="context-box">${q.context}</div>` : ''}
        <div class="options-grid">
          ${optionsHTML}
        </div>
        <div class="feedback-box" id="feedback-box"></div>
      </div>
    `;
  }

  function selectOption(selectedIdx) {
    if (hasAnswered) return;
    hasAnswered = true;

    const q = questions[currentQuestionIdx];
    const isCorrect = (selectedIdx === q.correctIndex);
    const feedbackBox = document.getElementById('feedback-box');

    // Deshabilitar todos los botones de opción
    q.options.forEach((_, idx) => {
      const btn = document.getElementById(`opt-${idx}`);
      btn.disabled = true;
      if (idx === q.correctIndex) {
        btn.classList.add('correct');
      } else if (idx === selectedIdx && !isCorrect) {
        btn.classList.add('incorrect');
      }
    });

    if (isCorrect) {
      streak++;
      xp += 15;
      score++;
      streakCount.innerText = streak;
      xpCount.innerText = xp;
      feedbackBox.className = 'feedback-box correct';
      feedbackBox.innerHTML = `<b>¡Excelente! 🎉</b><br>${q.explanation}`;
    } else {
      streak = 0;
      streakCount.innerText = streak;
      feedbackBox.className = 'feedback-box incorrect';
      feedbackBox.innerHTML = `<b>Respuesta incorrecta ❌</b><br>${q.explanation}`;
    }

    btnNext.disabled = false;
  }

  function nextQuestion() {
    if (currentQuestionIdx < questions.length - 1) {
      currentQuestionIdx++;
      renderQuestion();
    } else {
      showResults();
    }
  }

  function showResults() {
    const total = questions.length;
    const finalPercent = Math.round((score / total) * 100);
    progressText.innerText = `Completado`;
    progressPercent.innerText = `100%`;
    progressFill.style.width = `100%`;

    let message = '';
    let emoji = '🏆';
    if (finalPercent >= 90) {
      message = '¡Impresionante dominio del vocabulario y gramática! Estás listo para cantar y entender cada verso.';
      emoji = '🌟';
    } else if (finalPercent >= 70) {
      message = '¡Muy buen trabajo! Tienes una base sólida en las expresiones de la canción.';
      emoji = '🎉';
    } else {
      message = '¡Buen intento! Te recomendamos repasar las diapositivas de Escucha Activa para afinar el oído.';
      emoji = '💪';
    }

    quizArea.innerHTML = `
      <div class="results-screen">
        <div class="results-trophy">${emoji}</div>
        <h2 style="font-size: 1.8rem; font-weight: 800; color: #fff;">¡Quiz Completado!</h2>
        <div class="score-circle">
          <div class="score-number">${finalPercent}%</div>
          <div class="score-label">${score} de ${total}</div>
        </div>
        <p style="color: var(--text-muted); font-size: 1.05rem; max-width: 480px; line-height: 1.5;">${message}</p>
        <div style="display: flex; gap: 12px; margin-top: 10px;">
          <a href="../../player.html?song=Shawn_Mendes_Stitches" class="btn-next" style="text-decoration: none;">🎧 Escucha Activa</a>
          <button class="btn-back" onclick="restartQuiz()">🔁 Reintentar Quiz</button>
        </div>
      </div>
    `;

    btnNext.style.display = 'none';
  }

  function restartQuiz() {
    currentQuestionIdx = 0;
    score = 0;
    streak = 0;
    xp = 0;
    streakCount.innerText = '0';
    xpCount.innerText = '0';
    btnNext.style.display = 'inline-flex';
    renderQuestion();
  }

  window.addEventListener('DOMContentLoaded', () => {
    renderQuestion();
  });
</script>
</body>
</html>
